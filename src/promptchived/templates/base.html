<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Promptchived{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">Promptchived</a>
      <div class="topbar-actions">
        <nav class="main-nav">
          <a href="/conversations">{{ t('nav.conversations') }}</a>
          <a href="/search">{{ t('nav.search') }}</a>
        </nav>
        <form action="/language" method="post" class="language-form">
          <input type="hidden" name="next_url" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
          <span class="language-label">{{ t('language.label') }}</span>
          <select name="language" onchange="this.form.submit()" aria-label="{{ t('language.label') }}">
            <option value="en" {% if lang == 'en' %}selected{% endif %}>English</option>
            <option value="id" {% if lang == 'id' %}selected{% endif %}>Bahasa Indonesia</option>
          </select>
        </form>
      </div>
    </header>
    <main class="container">{% block content %}{% endblock %}</main>
    <footer>{{ t('footer.local') }}</footer>
  </body>
</html>
